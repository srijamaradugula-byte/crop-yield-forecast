name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate sample data if no real data is committed
        run: test -f data/yield_data.csv || python -m src.generate_sample_data
      - name: Train model
        run: python -m src.train
      - name: Run tests
        run: python -m pytest -q
